services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
      PORT: 4000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      # migration files are written here by "npm run migrate:baseline", so keep them in git
      - ./backend/prisma/migrations:/app/prisma/migrations
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api

  # Scheduled database + uploads backups into ./backups (see README)
  backup:
    build: ./backup
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro

volumes:
  mysqldata:
  uploads:
