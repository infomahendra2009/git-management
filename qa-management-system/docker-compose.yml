services:
  mysql:
    image: mysql:8.0
    container_name: qa-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-qa_management}
      - MYSQL_USER=${MYSQL_USER:-qa_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-this-password}
    volumes:
      - qa-mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: qa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - PORT=4000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-qa_app}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-change-this-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-qa_management}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    container_name: qa-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  qa-mysql-data:
